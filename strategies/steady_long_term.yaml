# 稳健中长期候选策略
name: steady_long_term
display_name: 稳健中长期候选
description: 面向中线和长期观察的防守型候选，优先考虑估值、流动性、波动与回撤控制
version: "1.0"
category: quality
tags: [quality, defensive, low_volatility, medium_long_term]
style:
  risk_profile: defensive
  holding_period: watchlist
  execution_style: quality_defensive
  market_regime: [risk_off, range_bound, low_volatility]
  capital_profile: medium_liquidity
  ui_badge: 稳健观察

screening:
  enabled: true
  market_scope: [cn]
  hard_filters:
    exclude_st: true
    amount_min: 100000000
    market_cap_min: 12000000000
    pe_ttm_min: 0
    pe_ttm_max: 35
    pb_min: 0
    pb_max: 4.5
    change_pct_min: -3.0
    change_pct_max: 4.5
    price_min: 3
    price_max: 200
    change_60d_min: -8.0
    change_60d_max: 30.0
    signal_score_min: 55
    range_20d_pct_max: 26.0
    volatility_20d_pct_max: 30.0
    max_drawdown_20d_pct_min: -8.0
    atr_20_pct_max: 4.2
  tech_weight: 0.22
  factor_weights:
    stability: 0.32
    value: 0.22
    liquidity: 0.17
    size: 0.10
    momentum: 0.08
    activity: 0.06
    theme_heat: 0.03
    reversal: 0.02
  scoring_profile:
    momentum_60d_overheat_pct: 30.0
    momentum_chase_start_pct: 4.0
    momentum_chase_penalty_slope: 18.0
    activity_ideal_volume_ratio: 1.3
    activity_ideal_turnover_rate: 2.2
    stability_hot_change_pct: 4.5
    stability_high_volatility_pct: 28.0
    stability_max_drawdown_floor_pct: -8.0
    stability_high_atr_pct: 4.0
    stability_low_daily_quality_score: 88.0
    stability_low_daily_quality_penalty_slope: 0.45
  risk_profile:
    chase_change_pct: 5.0
    abnormal_volume_ratio: 4.0
    high_turnover_rate: 9.0
    weak_signal_score: 52.0
    low_daily_quality_score: 85.0
    low_daily_quality_points: 2.5
    stale_daily_cache_points: 4.0
    fetch_failed_daily_points: 8.0
    low_llm_confidence: 0.45
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      金融: [券商, 银行, 保险]
      消费: [白酒, 食品, 家电, 零售, 消费]
      医药: [医药, 医疗, 创新药]
      公用事业: [电力, 燃气, 水务, 环保, 公用事业]
      红利资产: [运营商, 高速, 港口, 煤炭, 电力]
  scorecard_profile:
    value_quality_stability_min: 72.0
    value_quality_bonus: 2.0
    hot_money_penalty: 3.0
    volume_spike_ratio: 3.5
    volume_spike_penalty: 2.0
  ranking_hints: |
    你是研究助理，任务是解释并比较规则筛选出的 A 股候选，不提供买卖指令。
    按中线和长期、偏稳健的观察需求排序。优先考虑估值不过热、流动性充足、波动和回撤较低、数据质量可靠的候选；降低短线题材热度和单日涨幅的影响。
    只能使用输入中给出的行情和字段，不得编造公司财务、新闻、分红、行业地位或催化信息。缺少基本面或公告材料时，明确写“本次数据未覆盖，需人工核实”。
    对每只候选写清楚规则筛选支持的理由、主要风险和后续观察事项。避免“建议买入”“稳赚”“目标价”等确定性措辞；允许返回少于 5 只。
  max_output: 5
